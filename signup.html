<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an Account — Vijana Mental Hub</title>
<meta name="description" content="Create your Vijana Mental Hub account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .auth-wrap{ min-height: 78vh; display:flex; align-items:center; justify-content:center; padding: 48px 24px; }
  .auth-card{ background: var(--white); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 40px; max-width: 440px; width: 100%; box-shadow: 0 14px 34px rgba(15,82,87,.08); }
  .auth-card h1{ font-size: 1.8rem; margin-bottom: .2em; }
  .auth-card p.sub{ margin-bottom: 1.6em; }
  .auth-error{ display:none; background:#FBEAEC; border:1px solid var(--coral); color:#8f2f45; padding:12px 14px; border-radius:10px; font-weight:600; font-size:.9rem; margin-bottom:18px; }
  .auth-error.visible{ display:block; }
  .auth-submit{ width:100%; margin-top:4px; }
  .auth-foot{ margin-top:22px; font-size:.92rem; color:var(--ink-soft); text-align:center; }
  .auth-foot a{ color:var(--teal); font-weight:700; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="login.html" class="logo">
      <img src="Untitled%20design%20%285%29.png" alt="Vijana Mental Hub" class="logo-image">
      <span>Vijana Mental Hub</span>
    </a>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Set a username and password to get access to Vijana Mental Hub.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="signup-form" class="form-grid" novalidate>
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" minlength="3" required>
          <p class="form-note">At least 3 characters. Letters, numbers, spaces, "." and "_" only.</p>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
          <p class="form-note">At least 6 characters.</p>
        </div>
        <div>
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</main>

<script src="auth.js"></script>
<script>
  (function () {
    if (VMHAuth.isLoggedIn()) {
      window.location.replace('index.html');
      return;
    }

    document.getElementById('signup-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      var confirm = document.getElementById('confirm-password').value;
      var result = VMHAuth.signUp(username, password, confirm);
      var errorEl = document.getElementById('auth-error');

      if (!result.ok) {
        errorEl.textContent = result.error;
        errorEl.classList.add('visible');
        return;
      }
      errorEl.classList.remove('visible');
      window.location.href = 'index.html';
    });
  })();
</script>
</body>
</html>
